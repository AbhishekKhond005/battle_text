server.port=8081

# H2 Database (file-based for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/battletext
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# OAuth2 Google - Uses environment variables for security
# Set these in your environment or create a .env file:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Allow H2 console
spring.h2.console.enabled=true
